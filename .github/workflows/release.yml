name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.91.1"
  CROSS_VERSION: "0.2.5"

jobs:
  build-main:
    name: Build bridge ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - riscv64gc-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - s390x-unknown-linux-gnu
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned Rust toolchain cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-*
          key: ${{ runner.os }}-${{ runner.arch }}-rust-toolchain-${{ env.RUST_TOOLCHAIN }}-minimal

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Restore shared Cargo dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-

      - name: Restore bridge target cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: ${{ runner.os }}-rust-target-cross-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-target-cross-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-

      - name: Restore cross binary cache
        id: cross-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-${{ runner.arch }}-cross-${{ env.RUST_TOOLCHAIN }}-${{ env.CROSS_VERSION }}

      - name: Install pinned cross compiler
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo +"$RUST_TOOLCHAIN" install cross --version "$CROSS_VERSION" --locked

      - name: Verify cross compiler
        run: test -x "$HOME/.cargo/bin/cross" && "$HOME/.cargo/bin/cross" --version

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo +"$RUST_TOOLCHAIN" metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version"

      - name: Cross-build bridge release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cross +"$RUST_TOOLCHAIN" build --release --locked --target "$TARGET" --bin codex-ssh-bridge

      - name: Upload bridge binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$TARGET"
          install -m 0755 "target/$TARGET/release/codex-ssh-bridge" "dist/$TARGET/codex-ssh-bridge"

      - name: Upload bridge build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: main-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  build-helper:
    name: Build helper ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - s390x-unknown-linux-gnu
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned Rust toolchain cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-*
          key: ${{ runner.os }}-${{ runner.arch }}-rust-toolchain-${{ env.RUST_TOOLCHAIN }}-minimal

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Restore shared Cargo dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-

      - name: Restore helper target cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: ${{ runner.os }}-rust-target-cross-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-target-cross-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-

      - name: Restore cross binary cache
        id: cross-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-${{ runner.arch }}-cross-${{ env.RUST_TOOLCHAIN }}-${{ env.CROSS_VERSION }}

      - name: Install pinned cross compiler
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo +"$RUST_TOOLCHAIN" install cross --version "$CROSS_VERSION" --locked

      - name: Verify cross compiler
        run: test -x "$HOME/.cargo/bin/cross" && "$HOME/.cargo/bin/cross" --version

      - name: Cross-build helper release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cross +"$RUST_TOOLCHAIN" build --release --locked --target "$TARGET" --bin codex-ssh-bridge-helper

      - name: Verify helper format
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          helper_file="target/$TARGET/release/codex-ssh-bridge-helper"
          file "$helper_file"
          case "$TARGET" in
            *-unknown-linux-musl*|armv7-unknown-linux-musleabihf)
              file "$helper_file" | grep -Eiq 'statically linked|musl'
              ;;
            *)
              file "$helper_file" | grep -Eiq 'ELF'
              ;;
          esac

      - name: Upload helper artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "dist/remote-helpers"
          install -m 0755 "target/$TARGET/release/codex-ssh-bridge-helper" "dist/remote-helpers/$TARGET"

      - name: Publish helper build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: helper-${{ matrix.target }}
          path: dist/remote-helpers
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release archives
    needs: [build-main, build-helper]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source for package resources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download bridge artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: main-*
          path: staging
          merge-multiple: false

      - name: Download helper artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: helper-*
          path: staging
          merge-multiple: false

      - name: Assemble archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            armv7-unknown-linux-gnueabihf \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            riscv64gc-unknown-linux-gnu \
            powerpc64le-unknown-linux-gnu \
            s390x-unknown-linux-gnu; do
            name="codex-ssh-bridge-${version}-${target}"
            root="dist/$name"
            mkdir -p "$root/bin" "$root/remote-helpers" "$root/docs"
            install -m 0755 "staging/main-$target/codex-ssh-bridge" "$root/bin/codex-ssh-bridge"
            for helper in \
              x86_64-unknown-linux-musl \
              aarch64-unknown-linux-musl \
              armv7-unknown-linux-musleabihf \
              riscv64gc-unknown-linux-gnu \
              powerpc64le-unknown-linux-gnu \
              s390x-unknown-linux-gnu; do
              install -m 0755 "staging/helper-$helper/$helper" "$root/remote-helpers/$helper"
            done
            for resource in \
              .codex-plugin \
              skills \
              README.md \
              LICENSE \
              config.example.toml \
              .mcp.json.example; do
              cp -a "$resource" "$root/"
            done
            cp -a docs/security.md docs/performance.md "$root/docs/"
            test -x "$root/bin/codex-ssh-bridge"
            test -x "$root/remote-helpers/aarch64-unknown-linux-musl"
            test -f "$root/.codex-plugin/plugin.json"
            test -f "$root/skills/remote-ssh-ops/SKILL.md"
            test -f "$root/.mcp.json.example"
            tar -C "dist" -czf "dist/$name.tar.gz" "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          done

      - name: Upload packaged release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${GITHUB_REF_NAME#v}"
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -print0)
          test "${#assets[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
